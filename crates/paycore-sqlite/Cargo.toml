[package]
name = "paycore-sqlite"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
paycore = { path = "../.." }
anyhow = "1"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
pollster = "1"
paycore-worker = { path = "../paycore-worker" }
